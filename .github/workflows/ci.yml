name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core fonts-lohit-deva

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Schema up to date
        run: uv run python -m spec.export_schema --check

      - name: Validate catalog specs
        shell: bash
        run: uv run python -m tools.validate_spec automations/*/spec.json

      - name: Tests
        run: uv run pytest

      - name: Smoke test every catalog automation
        shell: bash
        run: |
          for spec in automations/*/spec.json; do
            uv run python -m engine "$spec" --smoke-test
          done

      # Windows rendering is checked on every PR: the guide screenshots come from this job.
      - name: Render guide screenshots (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for spec in automations/*/spec.json; do
            id=$(basename "$(dirname "$spec")")
            uv run python -m engine "$spec" --guide-mode "screenshots-windows/$id"
          done

      - name: Upload Windows screenshots
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots-windows/
          if-no-files-found: error

  # Every catalog automation packaged the way automation-builds does it (build.yml): the EXE
  # folder, its smoke test, a launch check on the real Windows desktop, Guide.pdf and the zip.
  package:
    name: package (${{ matrix.automation }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        automation: [invoice-generator, pdf-merge, bulk-rename, make-pdf]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (engine and PyInstaller only, like automation-builds)
        run: |
          uv sync --locked --no-dev --package makemyexe-engine
          uv sync --locked --no-dev --only-group build --inexact

      - name: Package, smoke test, launch check, guide
        run: uv run --no-sync python -m build.package automations/${{ matrix.automation }} --out dist --launch-check

      - name: Upload the app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.automation }}
          path: |
            dist/*.zip
            dist/Guide.pdf
            dist/report.json
          if-no-files-found: warn

  # On main: put the tested apps from the package jobs into R2, then catalog/manifest.json, so
  # the website's Download buttons serve them (build/publish_catalog.py). The only job with R2
  # secrets; it runs none of the packaged code, it only uploads the files.
  publish-catalog:
    name: publish catalog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-catalog
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: build

      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: artifacts

      - name: Upload apps and manifest to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 -m build.publish_catalog --artifacts artifacts --commit "$GITHUB_SHA"

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: TS types match the spec schema
        run: npm run check:types

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
