# Delete old workflow artifacts to stay inside GitHub Free's 500 MB artifact storage
# (docs/DEPLOY.md §10). Run by hand: Actions > Clean old artifacts > Run workflow. Deleting is
# permanent, so download anything you still need first. Uses only this run's GITHUB_TOKEN
# (actions: write on this repository); no secrets, no checkout, no code from the repo.
name: Clean old artifacts

on:
  workflow_dispatch:
    inputs:
      older_than_hours:
        description: Delete artifacts older than this many hours (0 = all)
        required: true
        default: "24"

permissions: {}

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HOURS: ${{ inputs.older_than_hours }}
    steps:
      - name: Delete artifacts
        run: |
          [[ "$HOURS" =~ ^[0-9]{1,5}$ ]] || { echo "::error::older_than_hours must be a number"; exit 1; }
          cutoff=$(date -u -d "-${HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | \"\(.id) \(.size_in_bytes) \(.name)\"" > old.txt
          count=0; bytes=0
          while read -r id size name; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && count=$((count + 1)) && bytes=$((bytes + size))
            echo "deleted $name ($((size / 1000000)) MB)"
          done < old.txt
          echo "### Deleted $count artifacts, $((bytes / 1000000)) MB" >> "$GITHUB_STEP_SUMMARY"
