[project]
name = "makemyexe-spec"
version = "0.1.0"
description = "AutomationSpec models, block catalog and JSON Schema export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spec"
