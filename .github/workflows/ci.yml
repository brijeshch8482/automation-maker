name: CI

# Local-first (CLAUDE.md): Windows builds and tests run on the developer's PC before a PR, so a
# pull request runs only the Linux jobs; main runs everything, because publish catalog needs the
# Windows builds. Docs-only changes run nothing. GitHub Free has 2,000 minutes a month and
# Windows minutes count twice.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

# A newer push to the same PR cancels the older run. main is never cancelled mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core fonts-lohit-deva

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Schema up to date
        run: uv run python -m spec.export_schema --check

      - name: Validate catalog specs
        shell: bash
        run: uv run python -m tools.validate_spec automations/*/spec.json

      - name: Tests
        run: uv run pytest

      - name: Smoke test every catalog automation
        shell: bash
        run: |
          for spec in automations/*/spec.json; do
            uv run python -m engine "$spec" --smoke-test
          done

      # Windows rendering is checked on every PR: the guide screenshots come from this job.
      - name: Render guide screenshots (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for spec in automations/*/spec.json; do
            id=$(basename "$(dirname "$spec")")
            uv run python -m engine "$spec" --guide-mode "screenshots-windows/$id"
          done

      - name: Upload Windows screenshots
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots-windows/
          if-no-files-found: error
          retention-days: 3

  # Every catalog automation packaged the way automation-builds does it (build.yml): the EXE
  # folder, its smoke test, a launch check on the real Windows desktop, Guide.pdf and the zip.
  package:
    name: package (${{ matrix.automation }})
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        automation: [invoice-generator, pdf-merge, bulk-rename, make-pdf]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (engine and PyInstaller only, like automation-builds)
        run: |
          uv sync --locked --no-dev --package makemyexe-engine
          uv sync --locked --no-dev --only-group build --inexact

      - name: Package, smoke test, launch check, guide
        run: uv run --no-sync python -m build.package automations/${{ matrix.automation }} --out dist --launch-check

      # Artifact storage is 500 MB on GitHub Free (docs/DEPLOY.md §10). The zips are only kept
      # on main, where publish catalog takes them minutes later; a PR keeps just the report.
      - name: Upload the app (main)
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.automation }}
          path: |
            dist/*.zip
            dist/Guide.pdf
            dist/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the report (PR)
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.automation }}
          path: dist/report.json
          if-no-files-found: warn
          retention-days: 3

  # Runner + packs (docs/ARCHITECTURE.md §8, Phase 2b). Every app is checked on Linux and its
  # guide made (build.pack_check), then packed and signed with a throwaway key made in this job;
  # only the public half leaves it. The Runner job trusts that key for this build only.
  packs:
    name: packs (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Qt libraries and fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core fonts-lohit-deva

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Check every app and make its guide
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for app in automations/* tests/fixtures/jobs/word-count; do
            uv run python -m build.pack_check "$app" --out "dist/checks/$(basename "$app")"
          done

      - name: Sign test packs with a throwaway key
        run: |
          python3 -m build.pack keygen --key-id ci-test --out "$RUNNER_TEMP/keys" --public-out dist/ci-keys.json
          export PACK_SIGNING_KEY="$(cat "$RUNNER_TEMP/keys/ci-test.pem")"
          for app in automations/*; do
            python3 -m build.pack make "$app" --out "dist/packs/$(basename "$app")" --kind catalog --key-id ci-test
          done
          python3 -m build.pack make tests/fixtures/jobs/word-count --out dist/packs/word-count --kind job --key-id ci-test
          rm -rf "$RUNNER_TEMP/keys"

      - name: Upload packs
        uses: actions/upload-artifact@v4
        with:
          name: packs
          path: |
            dist/packs/
            dist/ci-keys.json
            dist/checks/*/Guide.pdf
            dist/checks/*/report.json
          if-no-files-found: error
          retention-days: 1 # only the runner job needs it, minutes later

  runner:
    name: runner (Windows)
    needs: packs
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (engine and PyInstaller only)
        run: |
          uv sync --locked --no-dev --package makemyexe-engine
          uv sync --locked --no-dev --only-group build --inexact

      - uses: actions/download-artifact@v4
        with:
          name: packs
          path: packs

      - name: Build the Runner; run every pack, refuse changed ones, open the window
        run: |
          args=()
          for pack in packs/packs/*/app.mmx; do args+=(--check-pack "$pack"); done
          uv run --no-sync python -m build.runner --out dist/runner --extra-keys packs/ci-keys.json --launch-check --release-out dist/runner-release "${args[@]}"

      - name: Upload the Runner (main)
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: runner
          path: |
            dist/runner/*.zip
            dist/runner/report.json
          if-no-files-found: warn
          retention-days: 7

      # The copy publish catalog uploads to R2: committed keys only (the throwaway CI key is
      # gone, and the release stage proved a CI-signed pack is refused).
      - name: Upload the release Runner (main)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: runner-release
          path: dist/runner-release/
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Runner report (PR)
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: runner-report
          path: dist/runner/report.json
          if-no-files-found: warn
          retention-days: 3

  # A job with a custom step (tests/fixtures/jobs/word-count), packaged exactly as automation-builds
  # packages a custom job: pinned to its spec fingerprint, with engine.sandbox inside the EXE.
  # Not part of the catalog: its artifact is job-*, never app-*.
  package-custom:
    name: package (custom step)
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      JOB: tests/fixtures/jobs/word-count
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (engine and PyInstaller only, like automation-builds)
        run: |
          uv sync --locked --no-dev --package makemyexe-engine
          uv sync --locked --no-dev --only-group build --inexact

      - name: Package, smoke test, launch check, guide (pinned to the spec)
        run: |
          SPEC_SHA256=$(uv run --no-sync python -m spec.fingerprint "$JOB/spec.json")
          uv run --no-sync python -m build.package "$JOB" --out dist --launch-check --expect-spec-sha256 "$SPEC_SHA256"

      - name: Upload the app (main)
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: job-word-count
          path: |
            dist/*.zip
            dist/Guide.pdf
            dist/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the report (PR)
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: report-word-count
          path: dist/report.json
          if-no-files-found: warn
          retention-days: 3

  # On main: put the tested apps from the package jobs into R2, then catalog/manifest.json, so
  # the website's Download buttons serve them (build/publish_catalog.py). The only job with R2
  # secrets; it runs none of the packaged code, it only uploads the files. The secrets live in
  # the `catalog` environment (deployment branches: main only), never in repository secrets.
  publish-catalog:
    name: publish catalog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, package, runner]
    runs-on: ubuntu-latest
    environment: catalog
    timeout-minutes: 15
    concurrency:
      group: publish-catalog
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            build
            automations

      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: runner-release
          path: runner-release

      - name: Upload apps and manifest to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Signs the catalog packs (Phase 2b, docs/DEPLOY.md §9); unset: per-app zips only.
          PACK_SIGNING_KEY: ${{ secrets.PACK_SIGNING_KEY }}
          PACK_KEY_ID: ${{ vars.PACK_KEY_ID }}
        run: >-
          python3 -m build.publish_catalog --artifacts artifacts --commit "$GITHUB_SHA"
          --runner-release runner-release

  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests (token checks, refusals; the merge itself is tested by pytest)
        run: npm test

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: TS types match the spec schema
        run: npm run check:types

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
