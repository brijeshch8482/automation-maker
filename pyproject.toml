[project]
name = "makemyexe"
version = "0.1.0"
description = "MakeMyEXE monorepo: spec, engine, tools, catalog"
requires-python = ">=3.12,<3.13"
dependencies = [
    "makemyexe-spec",
    "makemyexe-engine",
    "makemyexe-api",
]

[dependency-groups]
build = [
    "pyinstaller>=6.11",
]
dev = [
    "jsonschema>=4.23",
    "pypdfium2>=4.30",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["spec", "engine", "api"]

[tool.uv.sources]
makemyexe-spec = { workspace = true }
makemyexe-engine = { workspace = true }
makemyexe-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "spec/src", "engine/src", "api/src"]
# Docs hold illustrative snippets; don't let `ruff format` rewrite them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The Qt stylesheet reads best one rule per line.
"engine/src/engine/ui/theme.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root holds tools/ (run as `python -m tools.<name>`), so make it importable.
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra"]
