[project]
name = "makemyexe-api"
version = "0.1.0"
description = "MakeMyEXE FastAPI service: catalog, jobs, routine and build callbacks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "makemyexe-spec",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "alembic>=1.14",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[tool.uv.sources]
makemyexe-spec = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
